<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriMind AI - AI Agriculture Assistant for Indian Farmers</title>

    <meta name="description"
          content="AI-powered agriculture assistant for Indian farmers. Get expert advice on crops, pest control, soil health, weather, government schemes, and farming practices. Supports voice and text.">

    <meta name="keywords"
          content="agriculture, farming, India, crops, pest control, soil health, AI assistant, chatbot, Kharif, Rabi, Zaid, wheat, rice, paddy, PM-KISAN, fertilizers, irrigation">

    <meta name="author" content="Meet Goyal">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0a1628">


    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="">
    <meta property="og:title" content="AgriMind AI - Smart Agriculture Assistant">
    <meta property="og:description"
          content="AI-powered smart agriculture assistant for agricultural guidance, crop-related questions, and farming advice.">
    <meta property="og:image" content="">
    <meta property="og:site_name" content="AgriMind AI">
    <meta property="og:locale" content="en_IN">


    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="">
    <meta name="twitter:title" content="AgriMind AI - AI Agriculture Assistant">
    <meta name="twitter:description"
          content="AI-powered agriculture assistant for Indian farmers. Supports voice and text-based agricultural advisory.">
    <meta name="twitter:image" content="">


    <!-- AI Crawlers -->
    <meta name="llms-txt" content="/llms.txt">
    <meta name="ai-content-declaration" content="human-reviewed">


    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AgriMind AI",
        "alternateName": "AI Agriculture Assistant",
        "url": "",
        "description": "AI-powered agriculture assistant for Indian farmers. Get expert advice on crops, pest control, soil health, weather, and government schemes.",
        "applicationCategory": "AgricultureApplication",
        "operatingSystem": "Web Browser",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR"
        },
        "author": {
            "@type": "Person",
            "name": "Meet Goyal"
        },
        "inLanguage": ["en", "hi"],
        "featureList": [
            "Agricultural Advisory",
            "Voice Input & Output",
            "Crop Information",
            "Pest Control Guidance",
            "Soil Health Guidance",
            "Government Scheme Information",
            "Multilingual Support"
        ]
    }
    </script>


    <!-- FAQ Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
            {
                "@type": "Question",
                "name": "What is AgriMind AI?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "AgriMind AI is an AI-powered agriculture assistant that helps Indian farmers with crop advice, pest control, soil health, weather information, and government schemes."
                }
            },
            {
                "@type": "Question",
                "name": "Can AgriMind AI provide agricultural advice?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Yes, AgriMind AI can answer questions about crops, farming practices, pest control, soil health, fertilizers, irrigation, weather, and agricultural schemes."
                }
            },
            {
                "@type": "Question",
                "name": "Is AgriMind AI free to use?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Yes, AgriMind AI is free to use and provides AI-powered agricultural advisory through text and voice."
                }
            }
        ]
    }
    </script>


    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link
        rel="icon"
        type="image/x-icon"
        href="{{ url_for('static', filename='images/favicon.ico') }}">

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="{{ url_for('static', filename='images/favicon.ico') }}">

    <link
        rel="apple-touch-icon"
        href="{{ url_for('static', filename='images/favicon.ico') }}">

    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.webmanifest') }}">
</head>


<body>

    <!-- ========== NAVBAR ========== -->

    <nav class="navbar">
        <div class="nav-inner">

            <a class="brand" href="/">
                <span class="brand-icon">
                    <i class="bi bi-flower2"></i>
                </span>

                <span>AgriMind AI</span>
            </a>

            <div class="nav-actions">

                <button
                    class="nav-btn"
                    id="clearBtn"
                    title="Clear conversation">

                    <i class="bi bi-trash3"></i>
                    <span class="btn-label">New Chat</span>

                </button>

                <button
                    class="nav-btn"
                    id="themeToggle"
                    title="Toggle theme">

                    <i
                        class="bi bi-moon-stars-fill"
                        id="themeIcon">
                    </i>

                </button>

            </div>

        </div>
    </nav>


    <!-- ========== MAIN ========== -->

    <main class="main">

        <div class="chat-card">

            <!-- Header -->

            <div class="card-header">

                <div class="header-left">

                    <div class="avatar">
                        <i class="bi bi-flower2"></i>
                    </div>

                    <div>

                        <h5>AgriMind AI</h5>

                        <span class="status">
                            <i class="bi bi-circle-fill"></i>
                            Online
                        </span>

                    </div>

                </div>

                <span
                    class="date"
                    id="dateDisplay">
                </span>

            </div>


            <!-- Messages -->

            <div
                class="messages"
                id="chatMessages">
            </div>


            <!-- Typing Indicator -->

            <div
                class="typing"
                id="typingIndicator">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

                <span class="typing-label">
                    Thinking...
                </span>

            </div>


            <!-- Input -->

            <div class="input-bar">

                <!-- Voice Button -->

                <button
                    class="icon-btn mic"
                    id="voiceBtn"
                    title="Record voice">

                    <i class="bi bi-mic"></i>

                </button>


                <!-- Text Input -->

                <form
                    id="chatForm"
                    class="input-row"
                    autocomplete="off">

                    <input
                        type="text"
                        class="chat-input"
                        id="userInput"
                        placeholder="Ask about crops, pests, soil, or farming..."
                        aria-label="Message">

                    <button
                        type="submit"
                        class="send-btn"
                        id="sendBtn"
                        title="Send message">

                        <i class="bi bi-send-fill"></i>

                    </button>

                </form>

            </div>

        </div>

    </main>


    <!-- Audio Player -->

    <audio
        id="audioPlayer"
        class="d-none">
    </audio>


    <!-- jQuery -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- Custom JavaScript -->

    <script
        src="{{ url_for('static', filename='js/chat.js') }}">
    </script>

</body>
</html>
